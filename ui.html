<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 16px; height: 260px;
      display: flex; flex-direction: column; gap: 8px;
      font: 12px/1.4 Inter, system-ui, -apple-system, sans-serif;
      background: var(--figma-color-bg, #fff);
      color: var(--figma-color-text, #222);
    }
    h1 { margin: 0 0 8px; font-size: 16px; font-weight: 600; }
    button {
      display: flex; align-items: center; gap: 8px;
      width: 100%; min-height: 40px; padding: 8px;
      font: inherit; font-weight: 500; text-align: left;
      color: var(--figma-color-text, #222);
      background: var(--figma-color-bg-secondary, #f5f5f5);
      border: 1px solid var(--figma-color-border, #ddd);
      border-radius: 8px; cursor: pointer;
    }
    button:hover { background: var(--figma-color-bg-hover, #eee); }
    button:focus-visible { outline: 2px solid var(--figma-color-border-brand, #0d99ff); outline-offset: 2px; }
    button:disabled { opacity: .5; cursor: progress; }
    svg { width: 16px; height: 16px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    #status {
      margin-top: auto; padding: 8px; min-height: 40px;
      border: 1px solid var(--figma-color-border, #ddd);
      border-radius: 8px; color: var(--figma-color-text-secondary, #666);
    }
    #status[data-error="true"] { color: var(--figma-color-text-danger, #c33); }
  </style>
</head>
<body>
  <h1>figmaCleaner v1.0</h1>
  <button type="button" data-action="clean-hidden">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10 5.2A12 12 0 0 1 21 12a16 16 0 0 1-3 4M6 6a16 16 0 0 0-3 6s3 7 9 7a12 12 0 0 0 4-1M10 10a3 3 0 0 0 4 4"/></svg>
    Remove Hidden Layers
  </button>
  <button type="button" data-action="clean-empty">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 12h6"/></svg>
    Delete Empty Frames &amp; Groups
  </button>
  <button type="button" data-action="unwrap-groups">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/><rect x="8" y="8" width="8" height="8" rx="1"/></svg>
    Unwrap Single-Child Groups
  </button>
  <div id="status" role="status" aria-live="polite" aria-atomic="true">Ready to clean the current page.</div>
  <script>
    const buttons = Array.from(document.querySelectorAll('button'));
    const status = document.getElementById('status');
    buttons.forEach(button => button.addEventListener('click', () => {
      buttons.forEach(item => { item.disabled = true; });
      status.textContent = 'Cleaning the current page…';
      status.dataset.error = 'false';
      window.parent.postMessage({ pluginMessage: { type: button.dataset.action } }, '*');
    }));
    window.addEventListener('message', event => {
      if (event.source !== window.parent) return;
      const message = event.data && event.data.pluginMessage;
      if (!message || message.type !== 'result' || typeof message.message !== 'string') return;
      status.textContent = message.message;
      status.dataset.error = String(message.error === true);
      buttons.forEach(button => { button.disabled = false; });
    });
  </script>
</body>
</html>
