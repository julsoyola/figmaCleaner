<!DOCTYPE html>
<html>
<head>
  <style>
    :root {
      --bg: var(--figma-color-bg, #1e1e1e);
      --text: var(--figma-color-text, #ffffff);
      --btn-bg: var(--figma-color-bg-secondary, #2c2c2c);
      --btn-hover: var(--figma-color-bg-brand, #0d99ff);
      --border: var(--figma-color-border, #383838);
    }
    body {
      font-family: Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    h2 { 
      font-size: 13px; 
      margin: 0 0 4px 0; 
      font-weight: 600; 
      letter-spacing: 0.5px;
      text-transform: lowercase;
    }
    .btn {
      background: var(--btn-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-family: 'JetBrains Mono', 'Fira Code', monospace, sans-serif;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
    }
    .btn:hover:not(:disabled) {
      background: var(--btn-hover);
      color: #ffffff;
      border-color: var(--btn-hover);
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #status {
      font-size: 11px;
      font-family: 'JetBrains Mono', 'Fira Code', monospace, sans-serif;
      opacity: 0.6;
      margin-top: 4px;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <h2>figmaCleaner_v1.0</h2>
  <button class="btn" id="clean-hidden">[x] Remove Hidden Layers</button>
  <button class="btn" id="clean-empty">[ ] Delete Empty Containers</button>
  <button class="btn" id="unwrap-groups">[~] Unwrap Single-Child Groups</button>
  <div id="status">> ready to scan page</div>

  <script>
    const buttons = document.querySelectorAll('.btn');
    const statusEl = document.getElementById('status');

    function sendMsg(type) {
      setLoading(true, '> processing...');
      parent.postMessage({ pluginMessage: { type } }, '*');
    }

    function setLoading(isLoading, text) {
      buttons.forEach(btn => btn.disabled = isLoading);
      if (text) statusEl.textContent = text;
    }

    document.getElementById('clean-hidden').onclick = () => sendMsg('clean-hidden');
    document.getElementById('clean-empty').onclick = () => sendMsg('clean-empty');
    document.getElementById('unwrap-groups').onclick = () => sendMsg('unwrap-groups');

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (msg && msg.type === 'status') {
        setLoading(false, '> ' + msg.message.toLowerCase());
      }
    };
  </script>
</body>
</html>
